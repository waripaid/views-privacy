<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ajoute-moi sur Views</title>
<meta name="description" content="Stories, messages et amis : rejoins-moi sur Views.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Views">
<meta property="og:title" content="Ajoute-moi sur Views 👋">
<meta property="og:description" content="Stories, messages et amis : touche le lien pour m'ajouter sur Views.">
<meta property="og:image" content="https://waripaid.github.io/views-privacy/add/icon.jpg">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#8B00FF">
<link rel="icon" href="icon.jpg">
<style>
  :root {
    --primary: #8B00FF; --primary-dark: #6A00C2; --primary-light: #B44CFF;
    --bg: #0E0718; --card: #1A1028; --text: #FFFFFF; --muted: #B9AECB;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: radial-gradient(120% 80% at 50% 0%, #2A0F4A 0%, var(--bg) 60%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px;
    min-height: 100vh;
  }
  .card {
    width: 100%; max-width: 380px; text-align: center;
    background: var(--card); border: 1px solid rgba(255,255,255,.08);
    border-radius: 28px; padding: 32px 22px 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
  }
  .logo {
    width: 84px; height: 84px; border-radius: 24px; display: block; margin: 0 auto 18px;
    box-shadow: 0 8px 28px rgba(139,0,255,.45);
  }
  h1 { font-size: 22px; margin: 0 0 6px; font-weight: 800; }
  .user { font-size: 17px; font-weight: 700; color: var(--primary-light); margin: 0 0 10px; word-break: break-all; }
  p { color: var(--muted); font-size: 14.5px; line-height: 1.45; margin: 0 0 22px; }
  .btn {
    display: block; width: 100%; padding: 15px 18px; border-radius: 16px; border: 0;
    font-size: 16px; font-weight: 800; text-decoration: none; cursor: pointer; margin-bottom: 12px;
  }
  .primary { background: linear-gradient(135deg, var(--primary-light), var(--primary) 55%, var(--primary-dark)); color: #fff; }
  .ghost { background: rgba(255,255,255,.07); color: #fff; border: 1px solid rgba(255,255,255,.12); }
  .hidden { display: none; }
  .foot { font-size: 12px; color: #7F7493; margin-top: 10px; }
  .foot a { color: #9E8FB5; }
</style>
</head>
<body>
  <main class="card">
    <img class="logo" src="icon.jpg" alt="Views">
    <h1>Ajoute-moi sur Views</h1>
    <div class="user" id="user"></div>
    <p id="msg">Stories, messages et amis. Ouvre Views pour voir le profil et l'ajouter.</p>

    <a class="btn primary" id="open" href="#">Ouvrir dans Views</a>
    <a class="btn ghost" id="play" href="https://play.google.com/store/apps/details?id=com.views.app&amp;referrer=utm_source%3Dprofile_share">Télécharger sur Google Play</a>
    <a class="btn ghost hidden" id="ios" href="https://apps.apple.com/app/id6815465239">Télécharger sur l'App Store</a>

    <div class="foot">Views · <a href="https://waripaid.github.io/views-privacy/">Confidentialité</a></div>
  </main>

<script>
(function () {
  var qs = new URLSearchParams(location.search);
  var clean = function (v, re) { v = (v || '').replace(/^@/, '').trim(); return re.test(v) ? v : ''; };
  var u = clean(qs.get('u'), /^[A-Za-z0-9._\-]{1,40}$/);
  var id = clean(qs.get('id'), /^[A-Za-z0-9_\-]{6,64}$/);

  var userEl = document.getElementById('user');
  if (u) { userEl.textContent = '@' + u; document.title = '@' + u + ' sur Views'; }
  else { userEl.classList.add('hidden'); }

  var path = 'add/' + encodeURIComponent(u || '_') + (id ? '?id=' + encodeURIComponent(id) : '');
  var appUrl = 'views://' + path;
  var play = 'https://play.google.com/store/apps/details?id=com.views.app&referrer=' +
             encodeURIComponent('utm_source=profile_share' + (u ? '&utm_content=' + u : ''));
  document.getElementById('play').href = play;

  var ua = navigator.userAgent || '';
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var openBtn = document.getElementById('open');

  if (isAndroid) {
    // Chrome : ouvre l'app si elle est installée, sinon le Play Store.
    openBtn.href = 'intent://' + path + '#Intent;scheme=views;package=com.views.app;S.browser_fallback_url=' +
                   encodeURIComponent(play) + ';end';
  } else if (isIOS) {
    openBtn.href = appUrl;
    document.getElementById('ios').classList.remove('hidden');
    document.getElementById('play').classList.add('hidden');
  } else {
    // Ordinateur : pas d'app, on propose le téléchargement.
    openBtn.classList.add('hidden');
    document.getElementById('ios').classList.remove('hidden');
    document.getElementById('msg').textContent = 'Ouvre ce lien sur ton téléphone, ou télécharge Views :';
  }

  // Android : ouverture automatique (l'app, ou le Play Store si elle manque).
  // iPhone : pas d'essai automatique (Safari afficherait une erreur si
  // l'app n'est pas installée) — la personne touche « Ouvrir dans Views ».
  if (isAndroid) {
    setTimeout(function () { location.href = openBtn.href; }, 250);
  }
})();
</script>
</body>
</html>
